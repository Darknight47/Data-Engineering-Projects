resources:
  jobs:
    ingestion_job:
      name: "Road Weather & Traffic Intelligence - Ingestion"

      tasks:
        - task_key: run_main
          python_wheel_task:
            package_name: road_weather_traffic_intelligence
            entry_point: main
            parameters:
              - "--site-id"
              - "40"
          environment_key: default   

      environments:
        - environment_key: default
          spec:
            environment_version: "3"
            dependencies:
              - "${workspace.root_path}/artifacts/.internal/road_weather_traffic_intelligence-0.0.1-py3-none-any.whl"