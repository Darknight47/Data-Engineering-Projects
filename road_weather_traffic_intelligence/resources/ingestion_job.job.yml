resources:
  jobs:
    ingestion_job:
      name: "Road Weather & Traffic Intelligence - Ingestion"

      tasks:
        - task_key: run_main
          spark_python_task:
            python_file: ../src/road_weather_traffic_intelligence/main.py
            parameters:
              - "--site-id"
              - "40"
          environment_key: default
        
      environments:
        - environment_key: default
          spec:
            environment_version: "2"